# Long-running fuzzing, nightly. The per-push CI fuzzes each parser for
# twenty seconds, which catches the obvious. This runs each for ten minutes,
# which is where the subtle inputs — the ones a real attacker would craft —
# tend to surface. Any crash is uploaded as an artifact with the exact input
# that caused it, so it can be turned into a regression test.
name: fuzz-nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: Fuzz every parser, 10 minutes each
        run: |
          set -e
          for t in FuzzDeserializeTx FuzzDeserializeBlock FuzzDeserializeHeader FuzzAddress FuzzAmount; do
            go test ./core/ -run '^$' -fuzz="^${t}\$" -fuzztime=10m
          done
          for t in FuzzDecodeHello FuzzDecodeAddrs FuzzDecodeGetBlocks; do
            go test ./p2p/ -run '^$' -fuzz="^${t}\$" -fuzztime=10m
          done
          go test ./wallet/ -run '^$' -fuzz='^FuzzMnemonic$' -fuzztime=10m
      - name: Upload crashers, if any
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashers
          path: |
            core/testdata/fuzz/**
            p2p/testdata/fuzz/**
            wallet/testdata/fuzz/**
          if-no-files-found: ignore
